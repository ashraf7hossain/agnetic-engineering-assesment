{% extends "base.html" %}
{% block title %}Choose new password — Testify{% endblock %}
{% block content %}
<h1 class="font-display text-3xl">Choose a new password</h1>
{% if validlink %}
<form method="post" class="mt-8 max-w-md space-y-4 rounded-xl border border-slate-200 bg-white p-6">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="rounded-md bg-accent px-4 py-2 font-semibold text-white hover:bg-accentdark">Change password</button>
</form>
{% else %}
<p class="mt-4 text-red-600">This reset link is invalid or has expired.</p>
{% endif %}
<style>input { width: 100%; border: 1px solid #e2e8f0; border-radius: 0.375rem; padding: 0.5rem 0.75rem; }</style>
{% endblock %}
