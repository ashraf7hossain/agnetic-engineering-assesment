<article id="t-{{ t.pk }}" class="rounded-xl border border-slate-200 bg-white p-5 {% if just_updated %}ring-2 ring-accent{% endif %}">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="font-semibold">{{ t.name }} <span class="font-normal text-slate-500">&lt;{{ t.email }}&gt;</span></p>
      <p class="mt-1 text-xs uppercase tracking-wide text-slate-400">{{ t.get_status_display }} · {{ t.created_at|timesince }} ago</p>
    </div>
    {% if t.rating %}
    <p class="text-amber-500" aria-label="{{ t.rating }} stars">{% for i in "12345" %}{% if forloop.counter <= t.rating %}★{% else %}☆{% endif %}{% endfor %}</p>
    {% endif %}
  </div>
  <p class="mt-3 whitespace-pre-wrap text-slate-700">{{ t.body }}</p>
  {% if t.status == "pending" %}
  <div class="mt-4 flex gap-2">
    <button
      class="rounded-md bg-accent px-3 py-1.5 text-sm font-semibold text-white hover:bg-accentdark"
      hx-post="{% url 'spaces:approve' space.slug t.pk %}"
      hx-target="#t-{{ t.pk }}"
      hx-swap="outerHTML">
      Approve
    </button>
    <button
      class="rounded-md border border-slate-200 px-3 py-1.5 text-sm hover:border-red-400 hover:text-red-600"
      hx-post="{% url 'spaces:reject' space.slug t.pk %}"
      hx-target="#t-{{ t.pk }}"
      hx-swap="outerHTML">
      Reject
    </button>
  </div>
  {% endif %}
</article>
